spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/mcm?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DEV_DB_USERNAME:root}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
